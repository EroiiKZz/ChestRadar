plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	mavenCentral()
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases' }
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/chestradar.accesswidener")

	mods {
		"chestradar" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	modCompileOnly "maven.modrinth:jade:${project.jade_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "skipped", "failed" }
}

processResources {
	def version = project.version
	def minecraftDependency = project.minecraft_dependency
	def javaDependency = project.java_dependency
	inputs.property "version", version
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "java_dependency", javaDependency
	filesMatching("fabric.mod.json") {
		expand "version": version,
			"minecraft_dependency": minecraftDependency,
			"java_dependency": javaDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('build26') {
	group = 'build'
	description = 'Builds the Minecraft 26.2 jar from versions/26.2.'
	dependsOn gradle.includedBuild('chestradar-26.2').task(':build')
}

tasks.register('build263') {
	group = 'build'
	description = 'Builds the Minecraft 26.3 jar from versions/26.3.'
	dependsOn gradle.includedBuild('chestradar-26.3').task(':build')
}

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds both the 1.21.10 and the 26.2 jars.'
	dependsOn tasks.named('build'), tasks.named('build26'), tasks.named('build263')
}

ext.aeternumRoot = "$projectDir/../aeternum"
ext.aeternumPackage = 'chestradar'
ext.aeternumMainClass = 'ChestRadar'
ext.aeternumClientVariant = '1.21.10'
apply from: "$projectDir/../aeternum/aeternum.gradle"
